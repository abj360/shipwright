[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shipwright"
version = "0.1.0"
description = "Autonomous coding agent with a hardened sandboxed execution environment"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "docker>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.11"]

[project.scripts]
shipwright = "agent.cli:main"

[tool.setuptools.packages.find]
include = ["agent*", "sandbox*", "security*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests", "security"]
markers = { integration = "requires the integration environment" }
