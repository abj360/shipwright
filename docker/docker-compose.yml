services:
  agent:
    build:
      context: ..
      dockerfile: docker/agent.Dockerfile
    env_file: ../.env
    volumes:
      # the agent launches each task's sandbox as a sibling container
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - gateway

  gateway:
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    env_file: ../.env
    ports:
      - "4000:4000"

  ui:
    build:
      context: ..
      dockerfile: docker/ui.Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - gateway
