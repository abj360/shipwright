services:
  agent:
    build:
      context: ..
      dockerfile: docker/agent.Dockerfile
    env_file: ../.env
    volumes:
      # the agent launches each task's sandbox as a sibling container
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      gateway:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    env_file: ../.env
    ports:
      - "4000:4000"
    healthcheck:
      test: wget -qO- http://localhost:4000/health || exit 1
      interval: 10s
      timeout: 3s
      retries: 5

  ui:
    build:
      context: ..
      dockerfile: docker/ui.Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - gateway
