services:
  agent:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/agent.Dockerfile
    env_file: ../.env
    volumes:
      # the agent launches each task's sandbox as a sibling container
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - shipwright-egress

  gateway:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    env_file: ../.env
    ports:
      - "4000:4000"
    healthcheck:
      test: wget -qO- http://localhost:4000/health || exit 1
      interval: 15s
      timeout: 3s
      retries: 10

  ui:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/ui.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - gateway

networks:
  shipwright-egress:
    driver: bridge
