name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]' pytest-cov
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy agent sandbox security
      - run: pytest tests/ -q --cov=agent --cov=sandbox --cov-report=term-missing --cov-report=xml

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          # setup-node looks from the repo root, not the job's working-directory.
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker/docker-compose.yml build

  red-team:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest security/ -q -m 'not integration'

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit || true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm audit --prefix gateway || true

  merge-gate:
    runs-on: ubuntu-latest
    needs: [python, gateway, ui, docker, red-team]
    if: always()
    steps:
      - name: fail closed unless every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' >/dev/null && exit 0
          echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success")
            | "::error::job \(.key) did not succeed (result: \(.value.result))"'
          exit 1
