# gVisor (runsc) runtime settings for shipwright sandbox containers.
# Loaded by the agent host; the docker daemon must have runsc registered.
[runsc]
platform = "systrap"  # faster syscall path than ptrace
file-access = "exclusive"
directfs = true
iouring = false
network = "sandbox"  # no host networking, ever
debug = false
overlay = "rootfs"
strace = false
profile = false
